name: POINT foundation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: python -m pip install -r apps/api/requirements-dev.txt
      - run: npm ci --no-fund --no-audit
      - run: python infrastructure/scripts/export_openapi.py --check
      - run: node infrastructure/scripts/generate-contracts.mjs --check
      - run: npm run build
      - run: npm run test:prototype
      - run: python infrastructure/scripts/configure_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose --profile test run --build --rm tests
      - run: curl --fail http://127.0.0.1:8080/health/ready
      - if: always()
        run: docker compose down
